# Server Configuration
server.port=8080

# Database Configuration
# MySQL Database (Production)
spring.datasource.url=jdbc:mysql://localhost:3306/bakery_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:defaultpassword}

# H2 Database (disabled - switched to MySQL)
# spring.datasource.url=jdbc:h2:mem:bakery_db
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable SQL initialization for MySQL
spring.sql.init.mode=never

# For MySQL use: org.hibernate.dialect.MySQLDialect
# For PostgreSQL use: org.hibernate.dialect.PostgreSQLDialect

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging
logging.level.com.bakery=DEBUG
logging.level.org.springframework.web=DEBUG