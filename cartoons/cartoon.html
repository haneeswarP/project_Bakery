<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartoon Feedback Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    form {
      background-color: #fff;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 500px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    input[type="button"], 
    input[type="submit"],
    input[type="reset"], 
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 5px;
    }
    input[type="button"]:hover, 
    input[type="submit"]:hover, 
    input[type="reset"]:hover,
    button:hover {
      background-color: #45a049;
    }
    hr {
      border: 0;
      border-top: 1px solid #ddd;
      margin: 20px 0;
    }
    #output {
      padding: 10px;
      background-color: #e9e9e9;
      border-radius: 4px;
      width: 300px;
      height: fit-content;
      margin-top: 250px;
    }
  </style>

  <script>
    function showCartoonName() {
      var cartoon = document.getElementById("movie").value;
      document.getElementById("output").innerHTML = "<p>Your cartoon name is: <b>" + cartoon + "</b></p>";
    }

    function likeClicked() {
      document.getElementById("output").innerHTML = "<p>Mouse clicked on liked cartoon!</p>";
    }
    function dislikeClicked() {
      document.getElementById("output").innerHTML = "<p>Mouse clicked on disliked cartoon!</p>";
    }

    function selectCartoon(value) {
      if (value !== "") {
        document.getElementById("output").innerHTML = "<p>You selected: <b>" + value + "</b></p>";
      }
    }

    function focusEvent() {
      document.getElementById("output").innerHTML = "<p>You are entering your name...</p>";
    }

    function inputEvent(value) {
      document.getElementById("output").innerHTML = "<p>Typing... Current input: " + value + "</p>";
    }

    function invalidEvent() {
      document.getElementById("output").innerHTML = "<p>Please fill out this field properly!</p>";
    }

    function resetEvent() {
      alert("Form has been reset!");
      document.getElementById("output").innerHTML = "<p>Form has been reset.</p>";
    }

    function selectTextEvent() {
      document.getElementById("output").innerHTML = "<p>Text selected inside input!</p>";
    }

    function submitEvent() {
      alert("Form submitted successfully!");
      document.getElementById("output").innerHTML = "<p>Form submitted successfully!</p>";
    }

    function keyDownEvent() {
      document.getElementById("output").innerHTML = "<p>Key Down detected</p>";
    }
    function keyPressEvent() {
      document.getElementById("output").innerHTML = "<p>Key Press detected</p>";
    }
    function keyUpEvent() {
      document.getElementById("output").innerHTML = "<p>Key Up detected</p>";
    }

    function copyEvent() {
      document.getElementById("output").innerHTML = "<p>Cartoon name copied!</p>";
    }

    function myPasteFunction() {
      document.getElementById("output").innerHTML = "<p>You pasted text!</p>";
    }

    function mouseOverGood() {
      document.getElementById("output").innerHTML = "<p>You moved the mouse over: Good</p>";
    }
    function mouseOverBad() {
      document.getElementById("output").innerHTML = "<p>You moved the mouse over: Not Bad</p>";
    }
    function mouseOut() {
      document.getElementById("output").innerHTML = "<p>Mouse moved out of button</p>";
    }
  </script>
</head>
<body>
  <form onsubmit="submitEvent(); return false;" onreset="resetEvent()">
    <h1>Cartoon Feedback Form</h1>

    <label for="movie">Cartoon Name:</label><br>
    <input type="text" id="movie" name="movie" required
      oninput="inputEvent(this.value)" 
      oninvalid="invalidEvent()" 
      onselect="selectTextEvent()" 
      onkeydown="keyDownEvent()" 
      onkeypress="keyPressEvent()" 
      onkeyup="keyUpEvent()" 
      onpaste="myPasteFunction()"><br><br>

    <input type="button" value="Confirm Cartoon Name" onclick="showCartoonName()"><br><br>

    <label>Rate the Cartoon:</label><br>
    <button type="button" onclick="likeClicked()" onmouseover="mouseOverGood()" onmouseout="mouseOut()">Good</button>
    <button type="button" onclick="dislikeClicked()" onmouseover="mouseOverBad()" onmouseout="mouseOut()">Not Bad</button><br><br>

    <label>Choose Favourite Cartoon:</label><br>
    <select onchange="selectCartoon(this.value)">
      <option value="">Select</option>
      <option value="Kick Buttowski">Kick Buttowski</option>
      <option value="Toy Story">Toy Story</option>
      <option value="The Little Mermaid">The Little Mermaid</option>
      <option value="Avengers">Avengers</option>
    </select><br><br>

    <hr>
    <p><b id="cartoonToCopy" oncopy="copyEvent()">SpongeBob SquarePants</b></p>
    <p>Copy this cartoon name and paste it into the box below:</p>
    <input type="text" id="pasteBox" placeholder="Paste the text here" onpaste="myPasteFunction()">
    <hr>

    <label>Your Name:</label><br>
    <input type="text" onfocus="focusEvent()"><br><br>

    <input type="submit" value="Submit Feedback">
    <input type="reset" value="Reset">
    <input type="submit" value="Homepage" 
      onclick="alert('You are going to the home page!'); window.location='index.html';
      return false;">
  </form>

  <div id="output">
    <strong>All the form actions are displayed here:</strong>
  </div>
</body>
</html>
